services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:///./storage/buildwise.db
      UPLOAD_DIR: storage/uploads
      ANNOTATED_DIR: storage/annotated
      REPORTS_DIR: storage/reports
      KNOWLEDGE_JSON_PATH: data_demo/standards/safety_standards.json
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-local_keyword}
      CHROMA_DIR: ${CHROMA_DIR:-storage/chroma}
      CHROMA_MIN_SCORE: ${CHROMA_MIN_SCORE:-0.42}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - buildwise-storage:/app/storage
      - buildwise-chroma:/app/storage/chroma

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  buildwise-storage:
  buildwise-chroma:
